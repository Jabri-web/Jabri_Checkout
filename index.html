<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000">
    <meta name="color-scheme" content="dark">
    <title>واحة الجبري</title>

    <!-- ===== تحميل الهيدر والفوتر ===== -->
    <script src="js/init-page-root.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Cairo', Tahoma, sans-serif;
            min-height: 100vh;
        }
        
        /* ===== زر اللغة ===== */
        .lang-switch {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            gap: 4px;
            background: #1a1a2e;
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid #2a2a4e;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .lang-switch button {
            background: none;
            border: none;
            color: #8888bb;
            padding: 5px 12px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .lang-switch button:hover { color: #d0d0ea; background: #2a2a4e; }
        .lang-switch button.active { background: #6ae3ff; color: #0b0b16; }
        
        /* ===== المحتوى ===== */
        .container {
            max-width: 800px;
            margin: 120px auto 40px;
            padding: 20px;
            text-align: center;
        }
        .container h1 {
            color: #6ae3ff;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .container p {
            color: #aaa;
            font-size: 1.2rem;
            line-height: 1.8;
        }
        
        @media (max-width: 600px) {
            .lang-switch { top: 70px; padding: 3px 8px; }
            .lang-switch button { padding: 4px 8px; font-size: 0.7rem; }
            .container { margin-top: 100px; }
            .container h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <!-- ============================================= -->
    <!--  ✅ مكان الهيدر (سيظهر مع شاشة انتظار)  -->
    <!-- ============================================= -->
    <div id="header-placeholder"></div>

    <!-- ====== زر اللغة ====== -->
    <div class="lang-switch">
        <button id="lang-ar" class="active" onclick="window.toggleLang()">🇸🇦 عربي</button>
        <button id="lang-en" onclick="window.toggleLang()">🇬🇧 English</button>
    </div>

    <!-- ====== المحتوى الرئيسي ====== -->
    <div class="container">
        <h1>🌿 واحة الجبري</h1>
        <p>تراث اليمن العريق ونظرية السندباد الموحدة</p>
        <p style="font-size: 1.5rem; color: #6ae3ff; margin-top: 30px;">Z + C + A = 1</p>
    </div>

    <!-- ============================================= -->
    <!--  ✅ مكان الفوتر (يظهر في النهاية مثل ذيل الفأر)  -->
    <!-- ============================================= -->
    <div id="footer-placeholder"></div>

    <!-- ====== سكربت اللغة (احتياطي) ====== -->
    <script>
        if (typeof window.toggleLang !== 'function') {
            window.toggleLang = function() {
                const current = document.documentElement.lang || 'ar';
                const newLang = current === 'en' ? 'ar' : 'en';
                document.documentElement.lang = newLang;
                document.documentElement.dir = newLang === 'ar' ? 'rtl' : 'ltr';
                document.body.classList.remove('ar', 'en');
                document.body.classList.add(newLang);
                document.querySelectorAll('.lang-switch button').forEach(btn => {
                    btn.classList.toggle('active', btn.id === 'lang-' + newLang);
                });
                localStorage.setItem('preferred-language', newLang);
                if (typeof window.updateHeaderLang === 'function') window.updateHeaderLang();
                if (typeof window.updateFooterLang === 'function') window.updateFooterLang();
            };
        }
        
        // تطبيق اللغة المحفوظة
        const savedLang = localStorage.getItem('preferred-language') || 'ar';
        document.documentElement.lang = savedLang;
        document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
        document.body.classList.add(savedLang);
        document.getElementById('lang-ar').classList.toggle('active', savedLang === 'ar');
        document.getElementById('lang-en').classList.toggle('active', savedLang === 'en');
    </script>

</body>
</html>
