<!DOCTYPE html>
<!-- Jabri_Checkout | Compiler Pass2 Test -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jabri_Checkout Test</title>
<script>
(function(){
  // Pass2: استبدال github.io بالدومين الحالي
  const x = 'github.io';
  const y = location.hostname;
  
  window.addEventListener('error', e => console.error("Check:", e.message));

  // بناء الصفحة
  document.body.style.cssText = "margin:0;padding:50px 20px;font-family:Tahoma;background:#f5f7fa;text-align:center";
  
  document.body.innerHTML = `
    <h1>👁️ Jabri_Checkout Compiler Test 👁️</h1>
    <p>الدومين الحالي: <b>${y}</b></p>
    <p>لو انت على Vercel المفروض تشوف <b>vercel.app</b> بدل <b>github.io</b></p>
    
    <a href="https://Jabri-web.github.io/Zx_RieOS_v1.2/" target="_blank" 
       style="display:block;margin:20px auto;padding:18px;max-width:400px;background:#000;color:#fff;text-decoration:none;border-radius:15px;font-weight:bold">
       اختبار الرابط - Zx_RieOS_v1.2
    </a>
    
    <div id="result" style="margin-top:30px;padding:20px;background:white;border-radius:12px;border:1px solid #ddd"></div>
  `;

  // بعد ما يبني الصفحة، يعدل الروابط
  setTimeout(()=>{
    document.querySelectorAll('a').forEach(a => {
      if(a.href.includes(x)){
        const old = a.href;
        a.href = a.href.replace(/github\.io/g, y);
        document.getElementById('result').innerHTML += `<p>✅ تم التعديل: ${old} → ${a.href}</p>`;
      }
    });
  }, 100);
})();
</script>
</head>
<body></body>
</html>
